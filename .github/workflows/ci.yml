name: offline-core
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # GitHub actions/checkout v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # GitHub actions/setup-python v5
        with:
          python-version: '3.12'
      - name: Install pinned developer tools and original core
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Static checks
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m mypy src/scryveil
          python -m bandit -q -r src
      - name: Synthetic-only repository hygiene
        run: python scripts/hygiene.py
      - name: Offline unit, integration and adversarial tests
        run: python -m pytest -q
      - name: Offline synthetic CLI demonstration
        run: python scripts/demo.py
      - name: Synthetic privacy review demonstration
        run: python scripts/privacy_demo.py
      - name: Isolated diagnostic investigation demonstration
        run: python scripts/investigation_demo.py
      - name: Version-aware diagnostic format demonstration
        run: python scripts/diagnostic_formats_demo.py
      - name: Package and installed-wheel smoke
        run: |
          python -m build --no-isolation
          python -m venv /tmp/scryveil-wheel-smoke
          /tmp/scryveil-wheel-smoke/bin/python -m pip install --no-index --no-deps dist/*.whl
          cd /tmp
          /tmp/scryveil-wheel-smoke/bin/scryveil doctor
          /tmp/scryveil-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/demo.py"
          /tmp/scryveil-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/privacy_demo.py"
          /tmp/scryveil-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/investigation_demo.py"
          /tmp/scryveil-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/diagnostic_formats_demo.py"
