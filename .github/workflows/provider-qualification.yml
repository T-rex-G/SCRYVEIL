name: synthetic-provider-model-experiment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  measure:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require explicitly approved synthetic experiment checkpoint
        id: experiment
        run: |
          python - <<'PY'
          import os, re, subprocess
          message = subprocess.check_output(['git', 'log', '-1', '--format=%B']).decode()
          match = re.search(r'\[provider-qualification:([0-9a-f]{64})\]', message)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('selected=' + str(match is not None).lower() + '\n')
              output.write('approved=' + (match.group(1) if match else '') + '\n')
          print('Approved synthetic experiment selected:', match is not None)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.experiment.outputs.selected == 'true'
        with:
          python-version: '3.12'
      - name: Install original package without inference credentials
        if: steps.experiment.outputs.selected == 'true'
        run: |
          python -m pip install setuptools==83.0.0
          python -m pip install --no-build-isolation --no-deps .
      - name: Verify exact disclosure plan offline before secret access
        if: steps.experiment.outputs.selected == 'true'
        env:
          SCRYVEIL_APPROVED_PLAN: ${{ steps.experiment.outputs.approved }}
        run: |
          install -m 600 configs/qualification-provider.json "$RUNNER_TEMP/scryveil-provider.json"
          python scripts/provider_qualification.py --provider-config "$RUNNER_TEMP/scryveil-provider.json" --scenario recurrence --scenario injection --scenario missing_evidence --preview > "$RUNNER_TEMP/scryveil-provider-plan.jsonl"
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = (Path(os.environ['RUNNER_TEMP']) / 'scryveil-provider-plan.jsonl').read_text()
          prefix = 'SCRYVEIL_MODEL_RESULT='
          plan = json.loads(raw.removeprefix(prefix))
          if plan['plan_sha256'] != os.environ['SCRYVEIL_APPROVED_PLAN']:
              raise SystemExit('Disclosure plan changed; new owner review required')
          print(raw)
          PY
      - name: Investigate fixed fictional cases through isolated broker and read-only worker
        if: steps.experiment.outputs.selected == 'true'
        env:
          SCRYVEIL_PROVIDER_API_KEY: ${{ secrets.SCRYVEIL_GOOGLE_API_KEY }}
          SCRYVEIL_APPROVED_PLAN: ${{ steps.experiment.outputs.approved }}
        run: |
          python scripts/provider_qualification.py --provider-config "$RUNNER_TEMP/scryveil-provider.json" --scenario recurrence --scenario injection --scenario missing_evidence --approve-plan-sha256 "$SCRYVEIL_APPROVED_PLAN"
