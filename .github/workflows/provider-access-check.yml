name: explicit-provider-catalog-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require explicit catalog-check checkpoint
        id: check
        run: |
          python - <<'PY'
          import os, re, subprocess
          message = subprocess.check_output(['git', 'log', '-1', '--format=%B']).decode()
          match = re.search(r'\[provider-access:([0-9a-f]{64})\]', message)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('selected=' + str(match is not None).lower() + '\n')
              output.write('approved=' + (match.group(1) if match else '') + '\n')
          print('Explicit catalog check selected:', match is not None)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.check.outputs.selected == 'true'
        with:
          python-version: '3.12'
      - name: Install original package without API credentials
        if: steps.check.outputs.selected == 'true'
        run: |
          python -m pip install setuptools==83.0.0
          python -m pip install --no-build-isolation --no-deps .
      - name: Verify exact no-evidence catalog plan offline
        if: steps.check.outputs.selected == 'true'
        env:
          SCRYVEIL_APPROVED_PLAN: ${{ steps.check.outputs.approved }}
        run: |
          install -m 600 configs/qualification-provider.json "$RUNNER_TEMP/scryveil-provider.json"
          python scripts/provider_access_check.py --provider-config "$RUNNER_TEMP/scryveil-provider.json" --catalog-endpoint https://generativelanguage.googleapis.com/v1beta/openai/models --catalog-auth-scheme bearer --candidate-model gemini-3.1-flash-lite --candidate-model models/gemini-3.1-flash-lite --candidate-model gemini-2.5-flash --candidate-model models/gemini-2.5-flash --candidate-model gemini-2.5-flash-lite --candidate-model models/gemini-2.5-flash-lite --preview > "$RUNNER_TEMP/scryveil-access-plan.jsonl"
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = (Path(os.environ['RUNNER_TEMP']) / 'scryveil-access-plan.jsonl').read_text()
          plan = json.loads(raw.removeprefix('SCRYVEIL_ACCESS_RESULT='))
          if plan['plan_sha256'] != os.environ['SCRYVEIL_APPROVED_PLAN']:
              raise SystemExit('Catalog plan changed; reviewed digest required')
          print(raw)
          PY
      - name: Read catalog once through isolated broker without inference or evidence
        if: steps.check.outputs.selected == 'true'
        env:
          SCRYVEIL_PROVIDER_API_KEY: ${{ secrets.SCRYVEIL_GOOGLE_API_KEY }}
          SCRYVEIL_APPROVED_PLAN: ${{ steps.check.outputs.approved }}
        run: |
          python scripts/provider_access_check.py --provider-config "$RUNNER_TEMP/scryveil-provider.json" --catalog-endpoint https://generativelanguage.googleapis.com/v1beta/openai/models --catalog-auth-scheme bearer --candidate-model gemini-3.1-flash-lite --candidate-model models/gemini-3.1-flash-lite --candidate-model gemini-2.5-flash --candidate-model models/gemini-2.5-flash --candidate-model gemini-2.5-flash-lite --candidate-model models/gemini-2.5-flash-lite --approve-plan-sha256 "$SCRYVEIL_APPROVED_PLAN"
